services:
  stats-postgres:
    image: postgres:17-alpine
    container_name: xray-stats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xray_stats}
      POSTGRES_USER: ${POSTGRES_USER:-xray_stats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    ports:
      - "127.0.0.1:${STATS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - stats_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  stats:
    build: .
    container_name: xray-stats
    restart: unless-stopped
    network_mode: host
    depends_on:
      stats-postgres:
        condition: service_healthy
    environment:
      INVENTORY: /app/inventory.json
      STATS_DATABASE_URL: postgresql://${POSTGRES_USER:-xray_stats}:${POSTGRES_PASSWORD}@127.0.0.1:${STATS_POSTGRES_PORT:-55432}/${POSTGRES_DB:-xray_stats}
      STATS_BIND: ${STATS_BIND:-127.0.0.1}
      STATS_WEB_PORT: ${STATS_WEB_PORT:-9093}
      STATS_API_TOKEN: ${STATS_API_TOKEN:?STATS_API_TOKEN required}
      STATS_NODE_TOKEN: ${STATS_NODE_TOKEN:?STATS_NODE_TOKEN required}
      STATS_POLL_INTERVAL: ${STATS_POLL_INTERVAL:-15}
      STATS_HTTP_TIMEOUT: ${STATS_HTTP_TIMEOUT:-5}
      STATS_RETENTION_DAYS: ${STATS_RETENTION_DAYS:-30}
    volumes:
      - ./inventory.json:/app/inventory.json:ro

volumes:
  stats_postgres_data:
