# Static across any caddy_host - uses relative paths (like the relay/xray
# composes), so this file never needs per-deployment templating.
# TODO: set image tags as parameter
services:
  caddy-subs:
    image: caddy:2-alpine
    container_name: caddy-subs
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SUBS_CONTENT_DIR:-/opt/caddy-subs-content}:/srv/subs:ro
      - caddy_data:/data
      - caddy_logs:/var/log/caddy
    env_file:
      - .env
    environment:
      - ORIGIN_VERIFY_SECRET
      - SUB_DOMAIN
      - SUB_PROFILE_TITLE
      - SUB_PROFILE_DESCRIPTION
      - SUB_SUPPORT_URL
      - SUB_SUPPORT_EMAIL
      - SUB_PROFILE_UPDATE_INTERVAL
      - SUB_APP_PROXY_ENABLE
      - SUB_APP_PROXY_MODE
      - SUB_APP_PROXY_PACKAGES
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_logs:
