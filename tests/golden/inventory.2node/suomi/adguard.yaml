http:
  pprof:
    port: 6060
    enabled: false
  address: 0.0.0.0:3000
  session_ttl: 720h
auth_attempts: 5
block_auth_min: 15
dns:
  bind_hosts:
    - 0.0.0.0
  port: 53
  upstream_dns:
    - https://dns.adguard-dns.com/dns-query
    - https://dns.cloudflare.com/dns-query
    - quic://dns.nextdns.io:853
    - https://dns.nextdns.io:443
    - quic://p0.freedns.controld.com:853
    - https://dns.cloudflare.com:443/dns-query
  upstream_dns_file: ""
  bootstrap_dns:
    - 1.1.1.1
    - 8.8.8.8
  fallback_dns: []
  all_servers: true
  fastest_addr: true
  cache_size: 33554432
  cache_optimistic: true
  cache_ttl_min: 0
  cache_ttl_max: 0
  refuse_any: true
  edns_client_subnet:
    custom_ip: ""
    enabled: false
    use_custom: false
  filtering_enabled: true
  filters_update_interval: 24
  parental_enabled: false
  safe_browsing_enabled: false
  safe_browsing_cache_size: 1048576
  safe_search:
    enabled: false
filters:
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
    name: AdAway Default Blocklist
    id: 2
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_4.txt
    name: MalwareDomainList.com Hosts List
    id: 4
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_59.txt
    name: AdGuard DNS Popup Hosts filter
    id: 59
  - enabled: true
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/hosts/pro.txt
    name: HaGeZi Multi PRO
    id: 103
  - enabled: true
    url: https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext
    name: Peter Lowe's Ad and tracking server list
    id: 104
  - enabled: true
    url: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    name: StevenBlack Unified hosts
    id: 105

user_rules:
  - "@@||www.googletagmanager.com^"
  - "@@||www.googletagmanager.com^"
  - "@@||telemetry.individual.githubcopilot.com^"
  - "||ad.youtube.com^"
  - "||doubleclick.net^"
  - "||googlesyndication.com^"
  - "||googleadservices.com^"
  - "||pagead2.googlesyndication.com^"
  - "||ads.youtube.com^"
  - "||youtubei.googleapis.com/youtubei/v1/log_event^"
  - "||taboola.com^"
  - "||outbrain.com^"
  - "||revcontent.com^"
  - "||mgid.com^"
  - "||contentad.net^"
  - "||zergnet.com^"
log:
  compress: false
  localtime: false
  max_backups: 0
  max_size: 100
  max_age: 3
  file: ""
  verbose: false
schema_version: 29
