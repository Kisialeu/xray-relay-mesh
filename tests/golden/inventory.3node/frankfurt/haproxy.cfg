# Rendered by relay-mesh/relay/render_config.sh from inventory.json - do not edit by hand.
global
    maxconn 1000
    log stdout format raw local0

resolvers dns_resolver
    nameserver dns1 1.1.1.1:53
    nameserver dns2 8.8.8.8:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s
    hold obsolete 0s

defaults
    mode tcp
    log global
    timeout connect 10s
    timeout client 600s
    timeout server 600s
    option tcplog
    retries 3

frontend relay_in_suomi
    bind *:8443
    default_backend relay_out_suomi

backend relay_out_suomi
    option tcp-check
    tcp-check connect
    server suomi suomi.example.com:443 check inter 10s fall 3 rise 2 resolvers dns_resolver resolve-prefer ipv4 init-addr none

frontend relay_in_istanbul
    bind *:8445
    default_backend relay_out_istanbul

backend relay_out_istanbul
    option tcp-check
    tcp-check connect
    server istanbul istanbul.example.com:443 check inter 10s fall 3 rise 2 resolvers dns_resolver resolve-prefer ipv4 init-addr none

frontend stats_in_frankfurt
    mode http
    bind *:9092
    option httplog
    stick-table type ip size 100k expire 60s store http_req_rate(60s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 60 }
    http-request deny deny_status 403 unless { src 203.0.113.10/32 }
    http-request deny deny_status 403 unless { req.hdr(X-Stats-Token) -m str replace-with-random-secret }
    http-request deny deny_status 404 unless { path -i /health /stats /online }
    default_backend stats_out_frankfurt

backend stats_out_frankfurt
    mode http
    option httpchk GET /health
    server local_stats 127.0.0.1:9091 check inter 10s fall 3 rise 2
